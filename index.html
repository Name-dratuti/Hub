  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); }
  .panel { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); }
  .btn { border: none; background: transparent; cursor: pointer; border-radius: var(--radius); transition: all 0.15s ease; font-family: inherit; }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.96); }
  .input { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); color: var(--text-primary); outline: none; font-family: inherit; }
  .input:focus { border-color: var(--accent-color); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.3s ease-out; }
  .animate-slide-up { animation: slideUp 0.3s ease-out; }
  .spinner { width: 32px; height: 32px; border: 3px solid #3e3e42; border-top-color: #0078D7; border-radius: 50%; animation: spin 1s linear infinite; }
  .spinner-sm { width: 16px; height: 16px; border: 2px solid #3e3e42; border-top-color: currentColor; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-box { display: none; position: fixed; inset: 0; background: #111; color: #f66; padding: 20px; font-family: monospace; font-size: 12px; overflow: auto; z-index: 9999; white-space: pre-wrap; }

});

  function getSystemInfo() {
    var ua = navigator.userAgent;
    var os = 'Unknown OS';
    var browser = 'Unknown Browser';
    if (ua.indexOf('Windows') >= 0) os = 'Windows';
    else if (ua.indexOf('Mac') >= 0) os = 'macOS';
    else if (ua.indexOf('Linux') >= 0) os = 'Linux';
    else if (ua.indexOf('Android') >= 0) os = 'Android';
    else if (ua.indexOf('iPhone') >= 0 || ua.indexOf('iPad') >= 0) os = 'iOS';
    if (ua.indexOf('Chrome') >= 0 && ua.indexOf('Edg') < 0) browser = 'Chrome';
    else if (ua.indexOf('Firefox') >= 0) browser = 'Firefox';
    else if (ua.indexOf('Safari') >= 0 && ua.indexOf('Chrome') < 0) browser = 'Safari';
    else if (ua.indexOf('Edg') >= 0) browser = 'Edge';
    return { userAgent: ua, os: os, browser: browser };
  }

  // Фолбэк-новости (показываются, если сеть недоступна или CORS блокирует)
  function getFallbackNews() {

    return [
      { id: 'demo-1', title: 'Россия запустила новый спутник связи «Экспресс-АМУ4»', link: '#', description: 'Роскосмос сообщил об успешном запуске телекоммуникационного спутника. Аппарат предназначен для обеспечения связи и вещания на территории России и стран СНГ. Запуск произведён с космодрома Байконур.', pubDate: new Date(now.getTime() - 1800000).toISOString(), source: 'Habr', sourceColor: '#65A3BE' },
      { id: 'demo-2', title: 'OpenAI представила новую модель GPT с улучшенным пониманием контекста', link: '#', description: 'Новая версия языковой модели демонстрирует значительный прогресс в задачах рассуждения и программирования. Разработчики отмечают улучшенную работу с длинными документами и снижение числа галлюцинаций.', pubDate: new Date(now.getTime() - 3600000 * 2).toISOString(), source: 'TechCrunch', sourceColor: '#0A9E01' },
      { id: 'demo-3', title: 'В Москве открыли самую длинную линию метро за последние годы', link: '#', description: 'Новая ветка соединила отдалённые районы с центром города. Общая протяжённость линии превышает 30 километров, на ней расположено 15 станций. Время в пути из спальных районов сократилось почти вдвое.', pubDate: new Date(now.getTime() - 3600000 * 4).toISOString(), source: 'Lenta', sourceColor: '#E41E26' },
      { id: 'demo-4', title: 'Apple представила новый MacBook с чипом M4 и поддержкой ИИ-функций', link: '#', description: 'Ноутбук получил обновлённый процессор с нейронным движком, повышенную автономность и улучшенный дисплей. Компания делает ставку на локальную обработку ИИ-задач без передачи данных в облако.', pubDate: new Date(now.getTime() - 3600000 * 6).toISOString(), source: 'TechCrunch', sourceColor: '#0A9E01' },
      { id: 'demo-5', title: 'Учёные создали аккумулятор, заряжающийся за 5 минут', link: '#', description: 'Новая технология на основе кремниевых анодов позволяет заряжать батарею до 80% всего за пять минут без потери ёмкости. Исследователи уже ведут переговоры с производителями электромобилей.', pubDate: new Date(now.getTime() - 3600000 * 8).toISOString(), source: 'Habr', sourceColor: '#65A3BE' },
      { id: 'demo-6', title: 'ЦБ снизил ключевую ставку: что это значит для экономики', link: '#', description: 'Регулятор принял решение о снижении ставки на фоне замедления инфляции. Эксперты ожидают оживления кредитования и роста инвестиций в реальный сектор. Курс рубля отреагировал укреплением.', pubDate: new Date(now.getTime() - 3600000 * 12).toISOString(), source: 'Lenta', sourceColor: '#E41E26' },
      { id: 'demo-7', title: 'Разработчики Linux выпустили ядро 6.10 с поддержкой нового оборудования', link: '#', description: 'Обновление приносит улучшенную поддержку видеокарт, процессоров и периферии. Также оптимизирована работа с файловой системой и повышена энергоэффективность для ноутбуков.', pubDate: new Date(now.getTime() - 3600000 * 18).toISOString(), source: 'Habr', sourceColor: '#65A3BE' },

  // ============ NEWS ============
  // Пытается загрузить реальные новости. При любой неудаче возвращает фолбэк.
  function fetchNews() {
    return new Promise(function(resolve) {
      console.log('🔄 Starting to fetch news...');
      var allNews = [];
      var sevenDaysAgo = new Date();
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

      var apiProviders = [
        { name: 'rss2json', buildUrl: function(u) { return 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(u) + '&count=20'; }, timeout: 6000 },
        { name: 'allorigins-raw', buildUrl: function(u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); }, timeout: 8000 }
      ];

      var feedIndex = 0;

      function nextFeed() {
        if (feedIndex >= RSS_FEEDS.length) { finish(); return; }
        var feed = RSS_FEEDS[feedIndex];
        console.log('📰 Fetching from ' + feed.name + '...');
        tryApi(0, feed, function() { feedIndex++; nextFeed(); });
      }

      function tryApi(apiIndex, feed, onDone) {
        if (apiIndex >= apiProviders.length) {
          console.log('  ⚠️ Failed ' + feed.name);
          onDone();
          return;
        }
        var api = apiProviders[apiIndex];
        console.log('  Trying ' + api.name + '...');

        var controller = new AbortController();
        var timeoutId = setTimeout(function() { controller.abort(); }, api.timeout);

        fetch(api.buildUrl(feed.url), { signal: controller.signal })
          .then(function(res) {
            clearTimeout(timeoutId);
            if (!res.ok) throw new Error('status ' + res.status);
            if (api.name === 'rss2json') {
              return res.json().then(function(data) {
                if (data.status !== 'ok' || !data.items) throw new Error('invalid');
                for (var i = 0; i < data.items.length; i++) {
                  var item = data.items[i];
                  var pd = new Date(item.pubDate);
                  if (pd < sevenDaysAgo) continue;
                  allNews.push({
                    id: item.guid || item.link || item.title,
                    title: stripHtml(item.title || ''),
                    link: item.link || '',
                    description: stripHtml(item.description || '').slice(0, 300),
                    pubDate: item.pubDate,
                    source: feed.name,
                    sourceColor: feed.color
                  });
                }
                console.log('  ✅ ' + data.items.length + ' items from ' + api.name);
                onDone();
              });
            } else {
              return res.text().then(function(xmlText) {
                var xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
                var items = xmlDoc.querySelectorAll('item');
                if (items.length === 0) throw new Error('no items');
                for (var i = 0; i < items.length; i++) {
                  var el = items[i];
                  var t = el.querySelector('title'); t = t ? t.textContent : '';
                  var l = el.querySelector('link'); l = l ? l.textContent : '';
                  var d = el.querySelector('description'); d = d ? d.textContent : '';
                  var p = el.querySelector('pubDate'); p = p ? p.textContent : '';
                  if (t && p) {
                    var dt = new Date(p);
                    if (dt >= sevenDaysAgo) {
                      allNews.push({
                        id: l || t, title: stripHtml(t), link: l,
                        description: stripHtml(d).slice(0, 300),
                        pubDate: dt.toISOString(),
                        source: feed.name, sourceColor: feed.color
                      });
                    }
                  }
                }
                console.log('  ✅ items from ' + api.name);
                onDone();
              });
            }
          })
          .catch(function(e) {
            clearTimeout(timeoutId);
            console.log('  ❌ ' + api.name + ': ' + e.message);
            tryApi(apiIndex + 1, feed, onDone);
          });
      }

      function finish() {
        console.log('📊 Total news: ' + allNews.length);
        if (allNews.length === 0) {
          console.log('⚠️ Using fallback news');
          resolve(getFallbackNews());
          return;
        }
        allNews.sort(function(a, b) { return new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime(); });
        resolve(allNews.slice(0, 50));
      }

      nextFeed();
    });
  }

  // ============ SEARCH ============
  function searchWikipedia(query) {
    return fetch('https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(query) + '&format=json&origin=*&srlimit=10')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.query || !data.query.search) return [];
        return data.query.search.map(function(item) {
          return { id: 'wiki-' + item.pageid, title: item.title, snippet: stripHtml(item.snippet), url: 'https://ru.wikipedia.org/wiki/' + encodeURIComponent(item.title), source: 'Wikipedia', sourceColor: '#666' };
        });
      })
      .catch(function() { return []; });
  }

  function searchDuckDuckGo(query) {
    return fetch('https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json&no_html=1&skip_disambig=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var results = [];
        if (data.Abstract) results.push({ id: 'ddg-abstract', title: data.Heading || query, snippet: data.Abstract, url: data.AbstractURL || '#', source: 'DuckDuckGo', sourceColor: '#DE5833' });
        if (data.RelatedTopics) {
          data.RelatedTopics.slice(0, 5).forEach(function(topic) {
            if (topic.Text && topic.FirstURL) results.push({ id: 'ddg-' + Math.random(), title: topic.Text.split(' - ')[0], snippet: topic.Text, url: topic.FirstURL, source: 'DuckDuckGo', sourceColor: '#DE5833' });
          });
        }
        return results;
      })
      .catch(function() { return []; });
  }

  function searchStackOverflow(query) {
    return fetch('https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=' + encodeURIComponent(query) + '&site=stackoverflow&pagesize=5')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.items) return [];
        return data.items.map(function(item) {
          return { id: 'so-' + item.question_id, title: stripHtml(item.title), snippet: item.excerpt || 'Stack Overflow question', url: item.link, source: 'Stack Overflow', sourceColor: '#F48024' };
        });
      })
      .catch(function() { return []; });
  }

  // ============ ICON ============
  function Icon(props) {
    var name = props.name;
    var size = props.size || 20;
    var p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
    if (name === 'play') return h('svg', Object.assign({}, p, { fill: 'currentColor' }), h('polygon', { points: '5,3 19,12 5,21' }));
    if (name === 'pause') return h('svg', Object.assign({}, p, { fill: 'currentColor' }), h('rect', { x: 6, y: 4, width: 4, height: 16 }), h('rect', { x: 14, y: 4, width: 4, height: 16 }));
    if (name === 'prev') return h('svg', p, h('polygon', { points: '19,20 9,12 19,4', fill: 'currentColor' }), h('line', { x1: 5, y1: 4, x2: 5, y2: 20 }));
    if (name === 'next') return h('svg', p, h('polygon', { points: '5,4 15,12 5,20', fill: 'currentColor' }), h('line', { x1: 19, y1: 4, x2: 19, y2: 20 }));
    if (name === 'music') return h('svg', p, h('path', { d: 'M9 18V5l12-2v13' }), h('circle', { cx: 6, cy: 18, r: 3 }), h('circle', { cx: 18, cy: 16, r: 3 }));
    if (name === 'close') return h('svg', p, h('line', { x1: 18, y1: 6, x2: 6, y2: 18 }), h('line', { x1: 6, y1: 6, x2: 18, y2: 18 }));
    if (name === 'queue') return h('svg', p, h('line', { x1: 8, y1: 6, x2: 21, y2: 6 }), h('line', { x1: 8, y1: 12, x2: 21, y2: 12 }), h('line', { x1: 8, y1: 18, x2: 21, y2: 18 }), h('line', { x1: 3, y1: 6, x2: 3.01, y2: 6 }), h('line', { x1: 3, y1: 12, x2: 3.01, y2: 12 }), h('line', { x1: 3, y1: 18, x2: 3.01, y2: 18 }));

              h('input', { type: 'text', value: searchQuery, onChange: function(e) { setSearchQuery(e.target.value); }, onKeyDown: function(e) { if (e.key === 'Enter') handleSearch(); }, placeholder: 'Введите запрос...', className: 'input flex-1 px-4 py-3 text-base', autoFocus: true }),
              h('button', { onClick: handleSearch, disabled: searchLoading, className: 'btn px-6 py-3 text-sm font-semibold text-white flex items-center gap-2', style: { backgroundColor: 'var(--accent-color)', opacity: searchLoading ? 0.6 : 1 } },
                searchLoading ? h(React.Fragment, null, h('span', { className: 'spinner-sm', style: { borderTopColor: '#fff' } }), 'Searching...') : h(React.Fragment, null, h(Icon, { name: 'search', size: 16 }), 'Search')
              )
            ),
            searchResults.length > 0 && h('div', { className: 'space-y-3' },
              h('span', { className: 'text-sm font-semibold', style: { color: 'var(--text-primary)' } }, 'Найдено результатов: ' + searchResults.length),
              searchResults.map(function(result) {
                return h('a', { key: result.id, href: result.url, target: '_blank', rel: 'noopener noreferrer', className: 'block p-4 rounded-lg', style: { backgroundColor: 'var(--bg-secondary)', borderLeft: '3px solid ' + result.sourceColor, textDecoration: 'none' } },
                  h('span', { className: 'text-xs font-bold px-2 py-0.5 rounded mb-1 inline-block', style: { backgroundColor: result.sourceColor + '20', color: result.sourceColor } }, result.source),
                  h('h3', { className: 'text-base font-semibold mb-1', style: { color: 'var(--accent-color)' } }, result.title),
                  h('p', { className: 'text-sm', style: { color: 'var(--text-secondary)' } }, result.snippet)
                );
              })
            ),
            !searchLoading && searchResults.length === 0 && searchQuery && h('div', { className: 'text-center py-12' },
              h('p', { className: 'text-lg mb-2', style: { color: 'var(--text-primary)' } }, 'Ничего не найдено')
            ),
            !searchQuery && h('div', { className: 'text-center py-12' },
              h('div', { className: 'inline-block p-6 rounded-full mb-4', style: { backgroundColor: 'var(--bg-secondary)' } },
                h('div', { style: { color: 'var(--text-secondary)' } }, h(Icon, { name: 'search', size: 48 }))
              ),
              h('p', { className: 'text-sm', style: { color: 'var(--text-secondary)' } }, 'Введите запрос, чтобы начать поиск')
            )
          )
        )
      ),

      // PLAYER
      h('input', { ref: fileInputRef, type: 'file', multiple: true, accept: 'audio/*', onChange: handleFileSelect, style: { display: 'none' } }),
      h('div', { className: 'fixed bottom-0 left-0 right-0 animate-slide-up', style: { backgroundColor: 'var(--player-bg)', borderTop: '1px solid var(--player-border)', boxShadow: '0 -2px 10px rgba(0,0,0,0.2)' } },
        currentTrack && !currentTrack.needsRefresh ? h(React.Fragment, null,
          h('div', { className: 'px-3 pt-1' },
            h('div', { className: 'relative h-0.5 rounded-full overflow-hidden', style: { backgroundColor: 'var(--player-track)' } },
              h('div', { className: 'absolute top-0 left-0 h-full rounded-full', style: { width: duration > 0 ? ((currentTime / duration) * 100) + '%' : '0%', backgroundColor: 'var(--accent-color)' } }),
              h('input', { type: 'range', min: 0, max: duration || 0, value: currentTime, onChange: handleTimelineChange, className: 'absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer', style: { zIndex: 1 } })
            )
          ),
          h('div', { className: 'flex items-center justify-between px-3 py-2' },
            h('div', { className: 'flex items-center gap-2 flex-1 min-w-0' },
              h('div', { className: 'w-9 h-9 rounded flex items-center justify-center flex-shrink-0', style: { backgroundColor: 'var(--player-track)', color: 'var(--player-text)' } }, h(Icon, { name: 'music', size: 16 })),
              h('div', { className: 'min-w-0 flex-1' },
                h('p', { className: 'text-xs font-semibold truncate', style: { color: 'var(--player-text)' } }, currentTrack.name),
                h('p', { className: 'text-[10px] truncate', style: { color: 'var(--player-text-secondary)' } }, 'Unknown Artist')
              )
            ),
            h('div', { className: 'flex items-center gap-2' },
              h('button', { onClick: function() { if (currentTrackIndex > 0) { setCurrentTrackIndex(function(p) { return p - 1; }); setIsPlaying(true); } }, className: 'btn w-8 h-8 flex items-center justify-center', style: { color: 'var(--player-text)' } }, h(Icon, { name: 'prev', size: 16 })),
              h('button', { onClick: handlePlayPause, className: 'btn w-10 h-10 flex items-center justify-center rounded-full text-white', style: { backgroundColor: 'var(--accent-color)' } }, isPlaying ? h(Icon, { name: 'pause', size: 18 }) : h(Icon, { name: 'play', size: 18 })),
              h('button', { onClick: function() { if (currentTrackIndex < tracks.length - 1) { setCurrentTrackIndex(function(p) { return p + 1; }); setIsPlaying(true); } }, className: 'btn w-8 h-8 flex items-center justify-center', style: { color: 'var(--player-text)' } }, h(Icon, { name: 'next', size: 16 }))
            ),
            h('div', { className: 'flex items-center gap-2 flex-1 justify-end' },
              h('button', { onClick: function() { setShowQueue(!showQueue); }, className: 'btn w-8 h-8 flex items-center justify-center', style: { color: showQueue ? 'var(--accent-color)' : 'var(--player-text-secondary)' } }, h(Icon, { name: 'queue', size: 16 })),
              h('div', { className: 'hidden sm:flex items-center gap-1', style: { color: 'var(--player-text-secondary)' } },
                h(Icon, { name: 'volume', size: 14 }),
                h('input', { type: 'range', min: 0, max: 1, step: 0.01, value: volume, onChange: function(e) { setVolume(parseFloat(e.target.value)); }, className: 'volume-slider w-16' })
              )
            )
          ),
          showQueue && h('div', { className: 'border-t px-3 py-2', style: { borderColor: 'var(--player-border)', backgroundColor: 'var(--player-bg)' } },
            h('div', { className: 'flex items-center justify-between mb-2' },
              h('span', { className: 'text-xs font-semibold', style: { color: 'var(--player-text)' } }, 'Очередь (' + tracks.length + ')'),
              h('button', { onClick: function() { if (fileInputRef.current) fileInputRef.current.click(); }, className: 'btn text-[10px] px-2 py-1 rounded', style: { color: 'var(--accent-color)', border: '1px solid var(--accent-color)' } }, '+ Добавить')
            ),
            h('div', { className: 'max-h-32 overflow-y-auto scrollbar-hide space-y-0.5' },
              tracks.map(function(track, index) {
                return h('div', { key: track.id, className: 'flex items-center justify-between py-1 px-2 rounded cursor-pointer', style: { backgroundColor: currentTrackIndex === index ? 'var(--player-track)' : 'transparent', borderLeft: currentTrackIndex === index ? '2px solid var(--accent-color)' : '2px solid transparent' }, onClick: function() { handleTrackSelect(index); } },
                  h('div', { className: 'flex items-center gap-2 flex-1 min-w-0' },
                    h('span', { className: 'text-[10px] w-4 text-center font-mono', style: { color: currentTrackIndex === index ? 'var(--accent-color)' : 'var(--player-text-secondary)' } }, currentTrackIndex === index && isPlaying ? '\u25B6' : (index + 1)),
                    h('div', { className: 'min-w-0 flex-1' }, h('p', { className: 'text-xs truncate', style: { color: track.needsRefresh ? 'var(--player-text-secondary)' : 'var(--player-text)' } }, track.name))
                  ),
                  h('button', { onClick: function(e) { e.stopPropagation(); handleRemoveTrack(index); }, className: 'btn p-0.5', style: { color: '#ff003c' } }, h(Icon, { name: 'close', size: 12 }))
                );
              })
            )
          )
        ) : h('div', { className: 'flex items-center justify-between px-3 py-2' },
          h('div', { className: 'flex items-center gap-2' },
            h('div', { className: 'w-9 h-9 rounded flex items-center justify-center', style: { backgroundColor: 'var(--player-track)', color: 'var(--player-text)' } }, h(Icon, { name: 'music', size: 16 })),
            h('div', null,
              h('p', { className: 'text-xs font-semibold', style: { color: 'var(--player-text)' } }, tracks.length > 0 ? tracks.length + ' треков' : 'Нет треков'),
              h('p', { className: 'text-[10px]', style: { color: 'var(--player-text-secondary)' } }, 'Добавьте музыку')
            )
          ),
          h('button', { onClick: function() { if (fileInputRef.current) fileInputRef.current.click(); }, className: 'btn px-3 py-1.5 text-xs font-semibold text-white rounded', style: { backgroundColor: 'var(--accent-color)' } }, '+ Добавить')
        )
      )
    );
  }

  // Рендер
  try {
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  } catch (e) {
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').textContent = 'Render error:\n' + e.message + '\n' + e.stack;
  }
})();
</script>
</body>
</html>
